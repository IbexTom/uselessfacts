<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Did You Know?</title>
 <style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(
      circle at top,
      #6dd5fa,
      #2980b9
    );
    color: #ffffff;
    font-family: "Comic Sans MS", "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px;
  }

  h1 {
    font-size: 48px;
    margin-bottom: 20px;
    letter-spacing: 1px;
    font-weight: 700;
  }

  #fact {
    font-size: 34px;
    line-height: 1.5;
    max-width: 85%;
    font-weight: 500;
  }
</style>

</head>
<body>
  <h1>Did You Know?</h1>
  <div id="fact">Loading trivia…</div>

  <script>
    fetch('https://uselessfacts.jsph.pl/random.json?language=en')
      .then(function(response) { return response.json(); })
      .then(function(data) {
        document.getElementById('fact').innerText = data.text;
      })
      .catch(function(error) {
        document.getElementById('fact').innerText = 'Trivia could not be loaded at this time.';
      });
  </script>
</body>
</html>
