<meta charset="UTF-8">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(
      circle at top,
      #ff9a9e,
      #fad0c4,
      #fbc2eb
    );
    color: #222;
    font-family: "Comic Sans MS", "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px;
  }

  h1 {
    font-size: 48px;
    margin-bottom: 20px;
    font-weight: 700;
  }

  #fact {
    font-size: 34px;
    line-height: 1.5;
    max-width: 85%;
    animation: popIn 0.6s ease-out;
  }

  @keyframes popIn {
    from {
      opacity: 0;
      transform: scale(0.96);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }
</style>

<h1>Did you know? 🤔</h1>
<div id="fact">Loading a delightfully useless fact…</div>

<script>
  fetch('https://uselessfacts.jsph.pl/random.json?language=en')
    .then(function(response) {
      return response.json();
    })
    .then(function(data) {
      document.getElementById("fact").innerText = data.text;
    })
    .catch(function() {
      document.getElementById("fact").innerText =
        "Fun fact loading failed… but curiosity still wins.";
    });
</script>
